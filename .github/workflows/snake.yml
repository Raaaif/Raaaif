name: Generate Snake Animation

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Fetch exact GitHub contribution calendar
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          gh api graphql \
            -f query='query($login:String!) {
              user(login:$login) {
                contributionsCollection {
                  restrictedContributionsCount
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date
                        contributionCount
                        contributionLevel
                        weekday
                      }
                    }
                  }
                }
              }
            }' \
            -F login='${{ github.repository_owner }}' \
            > contributions.json

      - name: Render custom contribution snake
        run: python scripts/render_contribution_grid.py

      - name: Show contribution total used by the snake
        run: cat dist/contribution-summary.json

      - name: Publish SVG files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
