name: Generate Profile Visuals

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Fetch GitHub profile data as token owner
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          gh api graphql \
            -f query='query {
              viewer {
                login
                name
                createdAt
                followers { totalCount }
                following { totalCount }
                repositories(ownerAffiliations: OWNER, privacy: PUBLIC) { totalCount }
                contributionsCollection {
                  restrictedContributionsCount
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date
                        contributionCount
                        contributionLevel
                        weekday
                      }
                    }
                  }
                }
              }
            }' \
            | sed 's/"viewer"/"user"/' \
            > contributions.json

      - name: Render profile visuals
        run: python scripts/render_contribution_grid.py

      - name: Show contribution summary
        run: cat dist/contribution-summary.json

      - name: Publish SVG files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
